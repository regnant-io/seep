[package]
name        = "seep-gateway"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
description = "The SeeP gateway: control plane for sessions, approvals, the fleet, and incidents"

[dependencies]
seep-core     = { path = "../seep-core" }
seep-proto    = { path = "../seep-proto" }
seep-identity = { path = "../seep-identity" }
seep-tools    = { path = "../seep-tools" }
seep-safety   = { path = "../seep-safety" }
seep-session  = { path = "../seep-session" }
seep-agent    = { path = "../seep-agent" }
seep-memory   = { path = "../seep-memory" }
seep-skills   = { path = "../seep-skills" }
seep-channels = { path = "../seep-channels" }
seep-mcp      = { path = "../seep-mcp" }

tokio        = { workspace = true }
tokio-util   = { workspace = true }
futures-util = { workspace = true }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
toml         = { workspace = true }
anyhow       = { workspace = true }
thiserror    = { workspace = true }
chrono       = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
axum         = { workspace = true }
tower        = { workspace = true }
tower-http   = { workspace = true }
http         = { workspace = true }
reqwest      = { workspace = true }
rusqlite     = { workspace = true }
uuid         = { workspace = true }
indexmap     = { workspace = true }
dashmap      = { workspace = true }
sha2         = { workspace = true }
hex          = { workspace = true }
hmac         = { workspace = true }
base64       = { workspace = true }
rand         = { workspace = true }
subtle       = { workspace = true }
once_cell    = { workspace = true }
humantime    = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
tower    = { workspace = true, features = ["util"] }
