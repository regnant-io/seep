# SeeP configuration — ~/.seep/config.toml
#
# Every section is optional. Everything below is the default unless stated
# otherwise, and the defaults are chosen to be the safe ones: loopback only,
# nobody allowlisted, a human required for anything that changes state.

# ── Models ─────────────────────────────────────────────────────────────────
#
# Different jobs deserve different models. Classifying an intent or summarising
# a log is cheap and easy; working out why production is broken is not. Routing
# per task rather than per installation means SeeP can be both genuinely private
# and genuinely capable.

[models.profiles.fast]
backend  = "server"                   # any OpenAI-compatible endpoint
model    = "qwen2.5:3b"
endpoint = "http://localhost:11434"   # Ollama, llama.cpp, vLLM…

[models.profiles.balanced]
backend  = "anthropic"
model    = "claude-sonnet-5"
api_key  = ""                         # or set ANTHROPIC_API_KEY

[models.profiles.deep]
backend  = "anthropic"
model    = "claude-opus-5"
api_key  = ""

[models.routing]
default_profile = "balanced"
# Fall back here when the chosen profile is failing.
fallback_profile = "fast"

# Refuse to send anything off this machine, ever. Absolute: if the local model
# is down, SeeP degrades rather than failing over to a remote one. An
# availability problem must not quietly become a confidentiality one.
sovereign = false

[models.routing.tasks]
classify    = "fast"
summarize   = "fast"
label       = "fast"
embed       = "fast"
respond     = "balanced"
plan        = "deep"
investigate = "deep"
postmortem  = "deep"

# ── Gateway ────────────────────────────────────────────────────────────────

[gateway]
# Loopback by default. Exposing an approval surface to the network is a
# decision to make deliberately — and SeeP refuses to start bound to a public
# address with no api_token, because a warning nobody reads is not a control.
bind = "127.0.0.1"
port = 7878

# Bearer token for the API and the control UI. Generated by `seep init`.
api_token = ""

# public_url = "https://ops.example.com"   # used in chat links and webhooks
# tls_cert   = "/etc/seep/cert.pem"
# tls_key    = "/etc/seep/key.pem"

max_concurrent_runs = 8
event_buffer        = 2048
web_ui              = true

# ── Approvals ──────────────────────────────────────────────────────────────

[approvals]
# How long a request stays open before it expires. A "yes" from six hours ago
# is not consent to act now.
ttl_secs = 900

# Read-only work runs without asking. This is what lets the agent investigate
# an incident at 3am without waking anyone.
auto_approve_read_only = true

high_signatures     = 1
critical_signatures = 1

# Require an operator's own device-held key for CRITICAL actions, rather than
# accepting a tap in a chat app. Stronger, but every approver needs a key.
require_device_signature_for_critical = false

# Re-post an unanswered request after this long. Zero disables reminders.
reminder_secs = 300

# ── Fleet ──────────────────────────────────────────────────────────────────

[fleet]
heartbeat_secs      = 15
stale_after_secs    = 60      # raised automatically if below 3× the heartbeat
max_steps_per_node  = 4
reconnect_min_secs  = 1
reconnect_max_secs  = 300
auto_enroll         = true

# ── Incidents ──────────────────────────────────────────────────────────────

[incidents]
enabled             = true
auto_triage         = true    # investigate as soon as an alert lands
propose_remediation = true    # and suggest a specific fix
write_postmortem    = true

# Repeat alerts inside this window update the incident quietly instead of
# notifying again. A problem that fires every thirty seconds must not page
# every thirty seconds, or the channel gets muted.
dedup_window_secs = 300

# Alerts below this are recorded but nobody is woken.
min_severity = "warning"

# Required. Without it every webhook endpoint rejects everything — an
# unauthenticated alert endpoint is a remote paging button for the internet.
webhook_secret = ""

# ── Channels ───────────────────────────────────────────────────────────────
#
# Every allowlist starts empty, and empty means *nobody*. An unrecognised
# sender's message is data the operator may want to see, never an instruction,
# and never an approval.

[channels]
# In a group conversation, only respond when explicitly addressed.
require_mention_in_groups = true

[channels.telegram]
enabled    = false
bot_token  = ""              # from @BotFather
allow_from = []              # Telegram user ids permitted to talk to the agent
default_chat_id = ""         # where unsolicited notifications go
can_approve = true           # may this channel carry approvals, or only notify?

[channels.slack]
enabled    = false
app_token  = ""              # xapp-… , for Socket Mode
bot_token  = ""              # xoxb-… , for the Web API
allow_from = []              # Slack user ids
default_channel = ""
can_approve = true

[channels.discord]
enabled    = false
bot_token  = ""
allow_from = []              # Discord user ids
default_channel_id = ""
can_approve = true

[channels.whatsapp]
enabled         = false
access_token    = ""         # WhatsApp Business Cloud API
phone_number_id = ""
verify_token    = ""         # echoed during Meta's webhook handshake
app_secret      = ""         # verifies X-Hub-Signature-256; required
allow_from      = []         # sender numbers, any format
default_recipient = ""
can_approve = true

# ── Memory ─────────────────────────────────────────────────────────────────
#
# What SeeP knows about your infrastructure, carried between sessions.
# Keyword recall always works; embeddings are an enhancement that degrades
# cleanly when the endpoint is unavailable.

[memory]
enabled         = true
embedding_model = "nomic-embed-text"
# embedding_endpoint = "http://localhost:11434"
recall_limit    = 8
retention_days  = 0          # 0 keeps everything; pruning spares anything used

# ── Audit ──────────────────────────────────────────────────────────────────

[audit]
enabled        = true
sign_entries   = true
retention_days = 90          # pruning is deliberate and logged

# ── Safety ─────────────────────────────────────────────────────────────────
#
# The baseline when no policy rule matches. Rules in ~/.seep/policy/*.toml can
# only tighten this.

[safety]
auto_confirm_low                    = true
auto_confirm_medium                 = false
require_confirmation_high           = true
require_typed_confirmation_critical = true
dry_run_default                     = false
max_retries                         = 2

# ── Legacy single-shot CLI ─────────────────────────────────────────────────
#
# Used by `seep "…"` when no [models] section is present. Kept so a 1.x config
# keeps working untouched.

[ai]
backend  = "server"
model    = "llama3"
endpoint = "http://localhost:11434"
api_key  = ""
context_window = 32768
temperature    = 0.2
stream         = true
max_tokens     = 4096

[session]
max_history             = 10000
context_window_commands = 20

[mcp]
auto_activate     = true
server_timeout_ms = 30000

[shell]
error_auto_diagnose = true
inline_suggestions  = false
history_ai_search   = true
