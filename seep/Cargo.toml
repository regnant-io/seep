[package]
name        = "seep"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
description = "SeeP — Sovereign Execution Environment Protocol"

[[bin]]
name = "seep"
path = "src/main.rs"

[dependencies]
seep-core    = { path = "../crates/seep-core" }
seep-mcp     = { path = "../crates/seep-mcp" }
seep-safety  = { path = "../crates/seep-safety" }
seep-session = { path = "../crates/seep-session" }
seep-script  = { path = "../crates/seep-script" }
seep-proto    = { path = "../crates/seep-proto" }
seep-identity = { path = "../crates/seep-identity" }
seep-tools    = { path = "../crates/seep-tools" }
seep-agent    = { path = "../crates/seep-agent" }
seep-gateway  = { path = "../crates/seep-gateway" }
seep-node     = { path = "../crates/seep-node" }
seep-skills   = { path = "../crates/seep-skills" }
seep-memory   = { path = "../crates/seep-memory" }
seep-channels = { path = "../crates/seep-channels" }

tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
anyhow       = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }
dirs         = { workspace = true }
colored      = { workspace = true }
async-trait  = { workspace = true }

clap         = { version = "=4.4.18", features = ["derive", "env"] }
clap_complete = "=4.4.10"
rustyline    = "=11.0"
indicatif    = "0.17"
futures-util = "0.3"
tokio-util   = { workspace = true }
reqwest      = { workspace = true }
tokio-tungstenite = { workspace = true }
indexmap     = { workspace = true }
humantime    = { workspace = true }
rand         = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile     = "3.8"
